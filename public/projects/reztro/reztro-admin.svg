<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#171613"/>
  <text x="60" y="70" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="28" fill="#F4EFE6">Reztro Kitchen Order System (KDS) & Admin Flow</text>
  <text x="60" y="100" font-family="'Manrope', sans-serif" font-weight="500" font-size="15" fill="#8A9E88">Live order status dispatching & kitchen ticket management</text>

  <!-- KDS Main Grid -->
  <g transform="translate(60, 130)">
    <!-- Column 1: Incoming -->
    <rect x="0" y="0" width="340" height="600" rx="14" fill="#25241F" stroke="#343129"/>
    <rect x="0" y="0" width="340" height="50" rx="14" fill="#2B2A24"/>
    <text x="20" y="32" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#C4855A">INCOMING (3)</text>
    
    <!-- Order Card 1 -->
    <rect x="15" y="70" width="310" height="150" rx="10" fill="#171613" stroke="#C4855A" stroke-width="1.5"/>
    <text x="30" y="100" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="18" fill="#F4EFE6">Table 04 · #108</text>
    <text x="240" y="100" font-family="'Manrope', sans-serif" font-weight="600" font-size="13" fill="#C4855A">01:42</text>
    <text x="30" y="130" font-family="'Manrope', sans-serif" font-weight="500" font-size="14" fill="#D3CEC4">2x Truffle Tagliatelle</text>
    <text x="30" y="155" font-family="'Manrope', sans-serif" font-weight="500" font-size="14" fill="#D3CEC4">1x Charred Citrus Mocktail</text>
    <rect x="200" y="170" width="110" height="34" rx="6" fill="#C4855A"/>
    <text x="255" y="192" font-family="'Manrope', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">Accept & Cook</text>

    <!-- Column 2: In Prep -->
    <rect x="370" y="0" width="340" height="600" rx="14" fill="#25241F" stroke="#343129"/>
    <rect x="370" y="0" width="340" height="50" rx="14" fill="#2B2A24"/>
    <text x="390" y="32" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#EAE8E3">IN PREPARATION (2)</text>
    
    <!-- Order Card 2 -->
    <rect x="385" y="70" width="310" height="150" rx="10" fill="#171613" stroke="#8A9E88"/>
    <text x="400" y="100" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="18" fill="#F4EFE6">Table 12 · #105</text>
    <text x="610" y="100" font-family="'Manrope', sans-serif" font-weight="600" font-size="13" fill="#8A9E88">07:15</text>
    <text x="400" y="130" font-family="'Manrope', sans-serif" font-weight="500" font-size="14" fill="#D3CEC4">1x Burrata Peach Salad</text>
    <text x="400" y="155" font-family="'Manrope', sans-serif" font-weight="500" font-size="14" fill="#D3CEC4">2x Roasted Garlic Bruschetta</text>
    <rect x="570" y="170" width="110" height="34" rx="6" fill="#8A9E88"/>
    <text x="625" y="192" font-family="'Manrope', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">Ready to Serve</text>

    <!-- Column 3: Ready / Served -->
    <rect x="740" y="0" width="340" height="600" rx="14" fill="#25241F" stroke="#343129"/>
    <rect x="740" y="0" width="340" height="50" rx="14" fill="#2B2A24"/>
    <text x="760" y="32" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#8A9E88">COMPLETED (14)</text>
    
    <rect x="755" y="70" width="310" height="90" rx="10" fill="#171613" opacity="0.6"/>
    <text x="770" y="105" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#8B8474">Table 08 · #102</text>
    <text x="770" y="130" font-family="'Manrope', sans-serif" font-weight="500" font-size="13" fill="#5D574B">Delivered by Staff · 14 mins total</text>
  </g>
</svg>
