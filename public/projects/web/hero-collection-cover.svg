    <rect x="30" y="120" width="80" height="30" rx="6" fill="#ECE3D4"/>
  </g>

  <g transform="translate(630, 270)">
    <rect width="450" height="190" rx="12" fill="#F4EFE6" stroke="#DFD2BC"/>
    <text x="30" y="65" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="24" fill="#25241F">EDITORIAL CURATION</text>
    <text x="30" y="100" font-family="'Manrope', sans-serif" font-size="13" fill="#5D574B">High-density typography layout exploring Swiss grid systems</text>
    <rect x="30" y="125" width="120" height="30" rx="15" fill="#25241F"/>
  </g>

  <g transform="translate(120, 490)">
