    <text x="30" y="70" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="22" fill="#C4855A">DARK LUXURY STUDIO</text>
    <text x="30" y="105" font-family="'Manrope', sans-serif" font-size="13" fill="#8B8474">Deep charcoal tones with burnt copper accent lines</text>
    <line x1="30" y1="135" x2="220" y2="135" stroke="#C4855A" stroke-width="2"/>
