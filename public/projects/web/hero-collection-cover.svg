  <text x="120" y="225" font-family="'Manrope', sans-serif" font-weight="400" font-size="16" fill="#8B8474">Figma design system explorations spanning brutalist, dark luxury, and minimalist interfaces</text>

  <!-- Multi-hero mockups preview -->
  <g transform="translate(120, 270)">
    <rect width="450" height="190" rx="12" fill="#25241F" stroke="#443F35"/>
