<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="socialBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1E1A" />
      <stop offset="50%" stop-color="#25241F" />
      <stop offset="100%" stop-color="#141310" />
    </linearGradient>
    <linearGradient id="copperAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4855A" />
      <stop offset="100%" stop-color="#DE9F75" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#socialBg)" />
  
  <!-- Subtle Grid Lines -->
  <line x1="100" y1="0" x2="100" y2="800" stroke="#F4EFE6" stroke-opacity="0.04" stroke-width="1" />
  <line x1="1100" y1="0" x2="1100" y2="800" stroke="#F4EFE6" stroke-opacity="0.04" stroke-width="1" />
  <line x1="0" y1="400" x2="1200" y2="400" stroke="#F4EFE6" stroke-opacity="0.04" stroke-width="1" />

  <!-- Instagram / Social Layout Cards Floating -->
  <!-- Card 1 -->
  <g transform="translate(180, 160)">
    <rect width="380" height="480" fill="#2C2B25" stroke="#C4855A" stroke-opacity="0.25" stroke-width="1.5" />
    <rect x="25" y="25" width="330" height="260" fill="#201F1B" />
    <text x="40" y="80" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="900" fill="#F4EFE6">LAUNCH 01</text>
    <text x="40" y="115" font-family="'Manrope', sans-serif" font-size="14" font-weight="600" fill="#C4855A" letter-spacing="2">SUMMER CAMPAIGN</text>
    <rect x="40" y="150" width="160" height="3" fill="#C4855A" />
    <!-- Text lines -->
    <rect x="25" y="315" width="220" height="12" fill="#F4EFE6" fill-opacity="0.8" />
    <rect x="25" y="340" width="280" height="8" fill="#F4EFE6" fill-opacity="0.4" />
    <rect x="25" y="358" width="190" height="8" fill="#F4EFE6" fill-opacity="0.4" />
    <!-- Like / Share Bar -->
    <rect x="25" y="420" width="330" height="1" fill="#F4EFE6" fill-opacity="0.1" />
    <circle cx="45" cy="445" r="8" fill="#C4855A" />
    <rect x="65" y="441" width="60" height="8" fill="#F4EFE6" fill-opacity="0.6" />
  </g>

  <!-- Card 2 (Overlapping) -->
  <g transform="translate(620, 120)">
    <rect width="400" height="540" fill="#1B1A16" stroke="#F4EFE6" stroke-opacity="0.15" stroke-width="1.5" />
    <rect x="30" y="30" width="340" height="360" fill="#2A2821" />
    <text x="50" y="100" font-family="'Space Grotesk', sans-serif" font-size="44" font-weight="900" fill="#F4EFE6" letter-spacing="-1">GROWTH</text>
    <text x="50" y="140" font-family="'Space Grotesk', sans-serif" font-size="44" font-weight="900" fill="#C4855A" letter-spacing="-1">MATTERS</text>
    <text x="50" y="180" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#8A9E88" letter-spacing="3">PAID ACQUISITION CREATIVES</text>
    <circle cx="200" cy="280" r="60" fill="none" stroke="#C4855A" stroke-width="2" stroke-dasharray="6,4" />
    <text x="200" y="286" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#F4EFE6" text-anchor="middle">+140%</text>
    <!-- Caption -->
    <rect x="30" y="420" width="260" height="12" fill="#F4EFE6" fill-opacity="0.9" />
    <rect x="30" y="445" width="320" height="8" fill="#F4EFE6" fill-opacity="0.4" />
    <rect x="30" y="465" width="210" height="8" fill="#F4EFE6" fill-opacity="0.4" />
  </g>

  <!-- Label Stamp -->
  <text x="80" y="740" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#C4855A" letter-spacing="3">SOCIAL MEDIA CREATIVES</text>
  <text x="80" y="760" font-family="'Manrope', sans-serif" font-size="11" font-weight="500" fill="#F4EFE6" fill-opacity="0.6">MULTI-PLATFORM AD CAMPAIGNS</text>
</svg>